[project]
name = "stt-backend"
version = "0.1.0"
description = "Real-Time Speech to Text - FastAPI backend"
requires-python = ">=3.12,<3.13"

# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers"
timeout = 120  # pytest-timeout: a hung WebSocket test fails instead of blocking CI
markers = [
    "real_model: runs a real Whisper model; skipped unless STT_REAL_MODEL_TESTS=1 (never downloads)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
# Third-party libraries without type information; wrapped behind typed adapters.
module = ["faster_whisper.*", "ctranslate2.*", "indic_transliteration.*", "webrtcvad"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
